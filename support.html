<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900">
 <nav class="w-full h-20 bg-black display-flex flex item-center " >
         <a class="flex"  href="LyrithHome.html">
          <img src="Photos/lyrith.png" class="w-23 h-20 ml-14" alt="">
          <h1 class="text-indigo-500 mt-5.5 font-black text-3xl">LYRITH</h1>
        </a>
        <a class="ml-155 m-7 font-sans text-white hover:text-indigo-500" href="LyrithHome.html">Home</a>
         <a class="ml-2 m-7 font-sans text-white hover:text-indigo-500" href="about.html">About</a>
         <a class="ml-2 m-7 font-sans text-indigo-500 hover:text-indigo-500" href="support.html">Support</a>
         <div class="w-0.5 h-9 bg-white mt-5.5 mr-4"></div>
         <a class="ml-4 font-sans mt-7 text-white hover:text-indigo-500" href="login.html">Login</a>
         <h1 class="text-white text-3xl m-3 mt-5.5">/</h1>
          <a class="ml- font-sans mt-7 text-white hover:text-indigo-500" href="signup.html">SignUp</a>
      </nav>
        <div class="text-center mt-7">
            <h1 class="text-white font-extrabold text-5xl">Contact us</h1>
            <h3 class="mt-3 text-gray-500 tracking-wide text-lg">The support team is active 24/7.</h3>
        </div>

        <form action="#" method="POST" class="mx-auto mt-15 max-w-xl sm:mt-6">
    <div class="grid grid-cols-1 gap-x-8 gap-y-6 sm:grid-cols-2">
      <div>
        <label for="first-name" class="block text-sm/6 font-semibold text-white">First name</label>
        <div class="mt-2.5">
          <input id="first-name" type="text" name="first-name" autocomplete="given-name" class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
        </div>
      </div>
      <div>
        <label for="last-name" class="block text-sm/6 font-semibold text-white">Last name</label>
        <div class="mt-2.5">
          <input id="last-name" type="text" name="last-name" autocomplete="family-name" class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
        </div>
      </div>
      <div class="sm:col-span-2">
        <label for="company" class="block text-sm/6 font-semibold text-white">Topic</label>
        <div class="mt-2.5">
          <input id="company" type="text" name="company" autocomplete="organization" class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
        </div>
      </div>
      <div class="sm:col-span-2">
        <label for="email" class="block text-sm/6 font-semibold text-white">Email</label>
        <div class="mt-2.5">
          <input id="email" type="email" name="email" autocomplete="email" class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
        </div>

        <label for="email" class="block text-sm/6 font-semibold text-white mt-2">Message</label>
        <div class="mt-2.5">
          <textarea name="Message" id="Message" class="bg-gray-800 w-full rounded-md h-25 text-amber-50  "></textarea>
        </div>
        <div class="w-full h-20 flex">
          <p class="text-gray-400 mt-2 "> Our response will be sent to your email address.</p>
            <button class="bg-indigo-500 h-12 w-40 text-amber-50 ml-60 mt-3 rounded-sm">SEND</button>
            
        </div>

        <script>
  const butonlar = document.querySelectorAll(".signup");

butonlar.forEach(function(buton) {
    buton.addEventListener("click", function() {
        window.location.href = "signup.html";
    });
});
</script>

<script>
  const buton = document.getElementById("signup");

buton.addEventListener("click", function() {
    window.location.href = "signup.html";
});
</script>
 

</body>
</html>
